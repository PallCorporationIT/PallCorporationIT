<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pall Quick Links</title>
<meta name="description" content="Quick access links and resources for Pall employees and partners." />

<!-- Local assets: pall logo and favicons stored in /assets -->
<link rel="icon" href="/assets/pall-favicon.svg" type="image/svg+xml">

<style>
:root{
    /* Dark mode palette with good contrast */
    --pall-blue: #61a8ff; /* lighter blue for accents */
    --pall-blue-light: #8fc8ff;
    --pall-bg: #071027; /* deep navy */
    --card-bg: #0d1a2b; /* slightly lighter card */
    --text: #e6f0fb; /* very light text */
    --muted: #98a8bf;
    --border: rgba(255,255,255,0.06);
    --focus: #8fc8ff;
    --card-shadow: 0 6px 18px rgba(2,6,23,0.6);
}

/* Respect user's preference for light mode if they choose it */
@media (prefers-color-scheme: light){
    :root{
        --pall-blue: #005a9c;
        --pall-blue-light: #0a76c8;
        --pall-bg: #f5f8fc;
        --card-bg: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d9e2ec;
        --focus: #0a76c8;
        --card-shadow: 0 2px 8px rgba(0,0,0,.05);
    }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
    font-family: "Segoe UI", Arial, sans-serif;
    background:linear-gradient(180deg,var(--pall-bg) 0%, #031022 100%);
    color:var(--text);
    padding:28px;
    -webkit-font-smoothing:antialiased;
}

/* Header with logo and centered title */
header{
    display:flex;
    align-items:center;
    gap:16px;
    max-width:1100px;
    margin:0 auto 24px auto;
    padding:8px 4px;
}
.header-left{display:flex;align-items:center;gap:12px;flex:1}
.header-logo{display:inline-flex;align-items:center}
.header-logo img{height:44px;width:auto;display:block}
.header-title{flex:1;text-align:center}
.header-title h1{margin:0;color:var(--pall-blue);font-weight:600;font-size:1.6rem}

.container{max-width:1100px;margin:0 auto}

/* Skip link - visible when focused */
.skip-link{
    position:absolute;left:-999px;top:auto;width:1px;height:1px;overflow:hidden;
}
.skip-link:focus{left:16px;top:16px;width:auto;height:auto;padding:8px 12px;background:var(--card-bg);color:var(--text);border:2px solid var(--focus);border-radius:4px;z-index:9999}

.section-title{margin:20px 0 16px;color:var(--muted);font-size:0.95rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:24px}
.small-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}

.card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:24px 18px;min-height:140px;transition:transform .18s ease, box-shadow .18s ease;box-shadow:var(--card-shadow);color:var(--text);
}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(2,6,23,0.7);border-color:rgba(143,200,255,0.12)}
.card:focus,.card:focus-visible{outline:3px solid var(--focus);outline-offset:4px;transform:translateY(-3px)}
.small-card{min-height:110px;padding:16px}

.favicon{width:56px;height:56px;border-radius:8px;margin-bottom:12px;display:block;object-fit:cover;background:transparent}
.small-card .favicon{width:40px;height:40px}

.card-title{font-size:1.05rem;font-weight:650;text-align:center;color:var(--text)}

.sr-only{position:absolute !important;width:1px !important;height:1px !important;padding:0 !important;margin:-1px !important;overflow:hidden !important;clip:rect(0, 0, 0, 0) !important;white-space:nowrap !important;border:0 !important}

.icon-decorative{line-height:1}

@media (prefers-reduced-motion: reduce){.card,.card:hover{transition:none;transform:none}}

/* Responsive adjustments */
@media (max-width:520px){
    .header-title h1{font-size:1.25rem}
    .favicon{width:48px;height:48px}
}
</style>
</head>

<body>
<a href="#main" class="skip-link">Skip to main content</a>

<header class="container">
  <div class="header-left">
    <div class="header-logo">
      <!-- Repo-hosted SVG logo for reliability and control. -->
      <img src="./assets/pall-logo.png"  alt="Pall logo" />
    </div>
  </div>
  <div class="header-title">
    <h1>Pall Quick Links</h1>
  </div>
</header>

<main id="main" role="main" class="container">

<div class="card-grid" aria-label="Primary quick links">

    <a class="card"
       href="https://bit.ly/danaherengagement"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Pall Engagement Survey — opens in a new tab">
        <!-- Use the site's favicon via Google's s2 service for real site icons -->
        <img class="favicon" src="/assets/qualtrics.ico&sz=128" alt="" aria-hidden="true" />
        <div class="card-title">Pall Engagement Survey</div>
        <span class="sr-only">Opens in a new tab</span>
    </a>

    <a class="card"
       href="https://register.danaherconnect.com"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Password Reset — opens in a new tab">
        <img class="favicon" src="/assets/pwm.ico&sz=128" alt="" aria-hidden="true" />
        <div class="card-title">Password Reset</div>
        <span class="sr-only">Opens in a new tab</span>
    </a>

</div>

<section aria-labelledby="additional-resources">
  <h2 id="additional-resources" class="section-title">Additional Resources</h2>

  <div class="small-card-grid" aria-label="Additional resources">

 <a class="card small-card"
       href="https://bookings.cloud.microsoft/book/TECHBARAppointments@danaher.onmicrosoft.com"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Schedule time to meet with Deland Client Technologies">
        <img class="favicon" src="https://www.google.com/s2/favicons?domain=bookings.cloud.microsoft&sz=128" alt="" aria-hidden="true" />
        <div class="card-title">Book meeting with Deland IT</div>
        <span class="sr-only">Opens in a new tab</span>
    </a>
      
      <a class="card small-card"
       href="https://jobs.danaher.com/global/en/search-results?keywords=deland,%20fl"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Danaher Jobs in Deland, Florida — opens in a new tab">
        <img class="favicon" src="https://www.google.com/s2/favicons?domain=jobs.danaher.com&sz=128" alt="" aria-hidden="true" />
        <div class="card-title">Danaher Jobs</div>
        <span class="sr-only">Opens in a new tab</span>
    </a>
      
    <a class="card small-card"
       href="https://sys.hsiplatform.com/en/PallCorpIndustrial/lp/login"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="HSI learning platform — opens in a new tab">
        <img class="favicon" src="https://www.google.com/s2/favicons?domain=sys.hsiplatform.com&sz=128" alt="" aria-hidden="true" />
        <div class="card-title">HSI</div>
        <span class="sr-only">Opens in a new tab</span>
    </a>

  </div>
</section>

</main>

<footer aria-hidden="true" style="visibility:hidden; height:0; overflow:hidden"><!-- reserved for future footer content --></footer>

</body>
</html>
